spring:
  application:
    name: neighbor-market
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:neighbor_market}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:neighbor_app}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  demo:
    user-a:
      password: ${DEMO_USER_A_PASSWORD:}
    user-b:
      password: ${DEMO_USER_B_PASSWORD:}
llm:
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:}
  model: ${LLM_MODEL:}
  provider: ${LLM_PROVIDER:}
