spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false&useSSL=${DB_USE_SSL:true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
app:
  allowed-origins: ${APP_ALLOWED_ORIGINS}
