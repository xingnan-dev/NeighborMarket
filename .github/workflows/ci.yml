name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  container-images:
    name: Build container images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          DB_PASSWORD: ci-config-only-not-a-production-secret
        run: docker compose config --quiet

      - name: Build backend and frontend images
        env:
          DB_PASSWORD: ci-build-only-not-a-production-secret
        run: docker compose build

  core-e2e:
    name: Core browser E2E
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PASSWORD: ci-e2e-db-not-a-production-secret
      DB_NAME: neighbor_market_e2e
      E2E_USER_A_PASSWORD: ci-e2e-user-a-not-a-production-secret
      E2E_USER_B_PASSWORD: ci-e2e-user-b-not-a-production-secret
      APP_PORT: '18088'
      APP_ORIGIN: http://127.0.0.1:18088
      E2E_BASE_URL: http://127.0.0.1:18088
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start isolated E2E stack
        run: docker compose -p neighbormarket-e2e -f compose.yml -f compose.e2e.yml up -d --build --wait --wait-timeout 180

      - name: Smoke test fresh deployment
        env:
          SMOKE_PASSWORD: ${{ env.E2E_USER_A_PASSWORD }}
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -BaseUrl $env:E2E_BASE_URL -Username neighbor_a

      - name: Run core browser workflow
        working-directory: frontend
        run: npm run test:e2e

      - name: Restart isolated stack
        run: |
          docker compose -p neighbormarket-e2e -f compose.yml -f compose.e2e.yml restart
          docker compose -p neighbormarket-e2e -f compose.yml -f compose.e2e.yml up -d --wait --wait-timeout 180

      - name: Smoke test restarted deployment and persisted item
        env:
          SMOKE_PASSWORD: ${{ env.E2E_USER_A_PASSWORD }}
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -BaseUrl $env:E2E_BASE_URL -Username neighbor_a -ExpectedMineMinimum 1

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated E2E stack
        if: always()
        run: docker compose -p neighbormarket-e2e -f compose.yml -f compose.e2e.yml down -v
